# Tests (build and check only, never deploys)
# ==========================================================================================
# [Claude 2026-10-29] Ported from Tertiary's test.yml. Every name, code and format comes from config.cmake, so a
# plugin made from this template gets the whole test run by filling that file in.
#
# Runs on every push to a work branch (anything except staging, production and main, which run the release
# pipeline in workflow.yml), and by hand (Actions tab, "Run workflow"). It never signs or deploys.
# The web job needs CE_GITHUB_PAT to read Wonderlab and WizardCore; missing access fails clearly.
#
#   mac-build    Apple Silicon (macos-15): builds the universal VST3 (and AU if wFORMATS has it), ReviewRender,
#                the unit tests and the host test; checks both chip types and wMACOS_MIN_VERSION, runs the unit
#                tests, auval, pluginval, the host test and a short render (plugin/tests/ci/mac_checks.sh)
#   mac-intel    Intel (macos-15-intel): no build, the same checks on the same universal files
#   windows      builds the VST3, runs the unit tests, the host test, pluginval and the render
#   compare      compares the renders of all three: they should sound the same
#   web          builds the Wonderlab web demo and runs its configured Playwright browser tests
#
# PLACEHOLDER (Tertiary's ui-tests branch, arriving later): UI robot tests that drive the real plugin window,
# and the auval/CI changes made there. They get their own job below ("ui-tests") when they land; see
# plugin/tests/ui/README.md and DEV-TO-DO.md.
#
# Mac minutes count 10x on private repos, so the Intel job reuses the Apple Silicon build.
# ==========================================================================================

name: Tests (no deploy)

on:
  push:
    branches-ignore:
      - staging
      - production
      - main
      - 'claude/installer-test*'   # those run installer-test.yml instead
    # [Codex 2026-10-30] Test every work-branch push, including documentation changes.
    # Branch-only filtering means tag pushes do not trigger this workflow.
  workflow_dispatch:

# A newer push to the same branch cancels the run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JUCE_TAG: 8.0.8            # Same as CMakeLists.txt
  PLUGINVAL_TAG: v1.0.4
  STRICTNESS: 10             # pluginval strictness (5 is the usual minimum for host compatibility)

jobs:

  # Job: Mac build and test (Apple Silicon)
  # ==========================================================================================
  mac-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read config.cmake
      run: |
        source plugin/tests/ci/config.sh
        for k in wPLUGIN_NAME wFORMATS HAS_AU; do echo "$k=${!k}" >> "$GITHUB_ENV"; done

    - name: Get JUCE and tools
      run: |
        git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/juce"
        brew list ninja >/dev/null 2>&1 || brew install ninja
        brew list ccache >/dev/null 2>&1 || brew install ccache
        curl -fsSL -o "$RUNNER_TEMP/pv.zip" "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/pluginval_macOS.zip"
        unzip -q -o "$RUNNER_TEMP/pv.zip" -d "$RUNNER_TEMP/pv"

    - name: Compiler cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ccache
        key: ccache-mac-${{ github.sha }}
        restore-keys: ccache-mac-

    - name: Configure (universal)
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
          -DWLA_REVIEW_RENDER=ON -DWLA_TESTS=ON -DWLA_COPY_PLUGIN_AFTER_BUILD=OFF \
          -DCPM_JUCE_SOURCE="$RUNNER_TEMP/juce" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: |
        TARGETS="${wPLUGIN_NAME}_VST3 ReviewRender ${wPLUGIN_NAME}Tests HostTest"
        if [ "$HAS_AU" = 1 ]; then TARGETS="$TARGETS ${wPLUGIN_NAME}_AU"; fi
        cmake --build build --target $TARGETS

    - name: Collect the built files
      run: |
        A="build/plugin"
        mkdir -p out
        cp -R "$A/${wPLUGIN_NAME}_artefacts/Release/VST3/${wPLUGIN_NAME}.vst3" out/
        if [ "$HAS_AU" = 1 ]; then cp -R "$A/${wPLUGIN_NAME}_artefacts/Release/AU/${wPLUGIN_NAME}.component" out/; fi
        cp "$A/ReviewRender_artefacts/Release/ReviewRender" out/
        cp "$A/${wPLUGIN_NAME}Tests_artefacts/Release/${wPLUGIN_NAME}Tests" out/
        cp "$A/HostTest_artefacts/Release/HostTest" out/

    - name: Upload the built files (for the Intel job)
      uses: actions/upload-artifact@v4
      with:
        name: mac-universal-build
        path: out/

    - name: Check, test and render
      run: bash plugin/tests/ci/mac_checks.sh out "$RUNNER_TEMP/pv/pluginval.app/Contents/MacOS/pluginval" mac-arm64

    - name: Upload logs and renders
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-mac-arm64
        path: results/


  # Job: Mac test (Intel), using the universal build above
  # ==========================================================================================
  mac-intel:
    needs: mac-build
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download the universal build
      uses: actions/download-artifact@v4
      with:
        name: mac-universal-build
        path: out

    - name: Get pluginval
      run: |
        curl -fsSL -o "$RUNNER_TEMP/pv.zip" "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/pluginval_macOS.zip"
        unzip -q -o "$RUNNER_TEMP/pv.zip" -d "$RUNNER_TEMP/pv"
        chmod +x out/ReviewRender out/*Tests out/HostTest

    - name: Check, test and render
      run: bash plugin/tests/ci/mac_checks.sh out "$RUNNER_TEMP/pv/pluginval.app/Contents/MacOS/pluginval" mac-x86_64

    - name: Upload logs and renders
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-mac-x86_64
        path: results/


  # Job: Windows build and test
  # ==========================================================================================
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read config.cmake
      shell: bash
      run: |
        source plugin/tests/ci/config.sh
        echo "wPLUGIN_NAME=$wPLUGIN_NAME" >> "$GITHUB_ENV"

    - name: Get JUCE and pluginval
      shell: bash
      run: |
        T=$(cygpath -m "$RUNNER_TEMP")   # forward slashes, so CMake doesn't read \ as escapes
        git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$T/juce"
        curl -fsSL -o "$T/pv.zip" "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/pluginval_Windows.zip"
        unzip -q -o "$T/pv.zip" -d "$T/pv"

    - name: Configure and build
      shell: bash
      run: |
        T=$(cygpath -m "$RUNNER_TEMP")
        cmake -S . -B build -A x64 -DWLA_REVIEW_RENDER=ON -DWLA_TESTS=ON -DWLA_COPY_PLUGIN_AFTER_BUILD=OFF -DCPM_JUCE_SOURCE="$T/juce"
        cmake --build build --config Release --target "${wPLUGIN_NAME}_VST3" ReviewRender "${wPLUGIN_NAME}Tests" HostTest -- -m

    - name: Test and render
      shell: bash
      run: |
        set -o pipefail
        mkdir -p results
        A=build/plugin
        V="$A/${wPLUGIN_NAME}_artefacts/Release/VST3/${wPLUGIN_NAME}.vst3"
        "$A/${wPLUGIN_NAME}Tests_artefacts/Release/${wPLUGIN_NAME}Tests.exe" 2>&1 | tee results/unit-tests.log
        "$A/HostTest_artefacts/Release/HostTest.exe" --vst3 "$V" --expect-demo 2>&1 | tee results/hosttest-vst3.log
        "$(cygpath -m "$RUNNER_TEMP")/pv/pluginval.exe" --strictness-level $STRICTNESS --validate-in-process --output-dir results \
          --validate "$V" 2>&1 | tee results/pluginval-vst3.log
        python plugin/tests/regression/render_matrix.py "$A/ReviewRender_artefacts/Release/ReviewRender.exe" \
          plugin/sample_audio results/renders --quick 2>&1 | tee results/renders.log

    - name: Upload logs and renders
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-windows
        path: results/


  # Job: Compare the renders across the three machines
  # ==========================================================================================
  compare:
    needs: [mac-build, mac-intel, windows]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download results
      uses: actions/download-artifact@v4
      with:
        pattern: results-*
        path: results

    - name: Compare Windows with both Macs
      run: |
        # Different compilers and chips round floating point differently; 1e-3 (-60 dBFS) is far below
        # anything audible here, and the report shows the actual numbers.
        set -o pipefail
        python3 plugin/tests/regression/compare_renders.py results/results-windows/renders results/results-mac-arm64/renders \
          --tolerance 1e-3 --report compare-windows-vs-mac-arm64.txt | tee -a "$GITHUB_STEP_SUMMARY"
        python3 plugin/tests/regression/compare_renders.py results/results-windows/renders results/results-mac-x86_64/renders \
          --tolerance 1e-3 --report compare-windows-vs-mac-x86_64.txt | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload the comparison
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: render-comparison
        path: compare-*.txt


  # Job: UI robot tests (PLACEHOLDER)
  # ==========================================================================================
  # Arrives from Tertiary's ui-tests branch: tests that drive the real plugin window (every control, menus,
  # About, the licence box, presets, open and close many times). Until then this job only says so.
  ui-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Placeholder
      run: echo "UI robot tests not ported yet (see plugin/tests/ui/README.md and DEV-TO-DO.md)."


  # Job: Web demo builds and Playwright tests (Wonderlab), nothing is deployed
  # [Codex 2026-10-30] Ported from Tertiary. Product names and capabilities come from the test config.
  # Windows matches the locally reviewed Chromium screenshot references (font rendering varies by OS).
  # ==========================================================================================
  web:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      WONDERLAB_DIR: ${{ github.workspace }}/Wonderlab
      WIZARDCORE_DIR: ${{ github.workspace }}/WizardCore
      CPM_WizardCore_SOURCE: ${{ github.workspace }}/WizardCore
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check dependency access
      env:
        PAT: ${{ secrets.CE_GITHUB_PAT }}
      run: |
        mkdir -p plugin/tests/web/out
        if [ -z "$PAT" ]; then
          echo "::error::CE_GITHUB_PAT is required to build and test the private web dependencies."
          echo "Web tests could not run: CE_GITHUB_PAT is missing." > plugin/tests/web/out/build.log
          exit 1
        fi

    - name: Checkout Wonderlab
      uses: actions/checkout@v4
      with:
        repository: CaulfieldEngineering/Wonderlab
        ref: 5248a157cfdf472caf1fafc7b9b71dec09485947
        path: Wonderlab
        token: ${{ secrets.CE_GITHUB_PAT }}
        persist-credentials: false

    - name: Checkout WizardCore
      uses: actions/checkout@v4
      with:
        repository: CaulfieldEngineering/WizardCore
        ref: 02306c2fce875141e83aa7540b7e4c86ea76081b
        path: WizardCore
        token: ${{ secrets.CE_GITHUB_PAT }}
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: plugin/tests/web/package-lock.json

    - name: Install Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 5.0.3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install ninja
        choco install ffmpeg --no-progress -y

    - name: Build the web demo
      shell: bash
      run: |
        set -euo pipefail
        node plugin/tests/web/build.mjs 2>&1 | tee plugin/tests/web/out/build.log

    - name: Install browser tests
      working-directory: plugin/tests/web
      run: |
        npm ci
        npx playwright install chromium

    - name: Test the browser demo
      working-directory: plugin/tests/web
      run: |
        npm run test:harness
        npm test -- --no-ai --engine=chromium

    - name: Upload browser test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-test-results
        path: plugin/tests/web/out/

    - name: Upload the actual browser build for WebKit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-demo-test-build
        path: |
          build/web/index.html
          build/web/plugin-config.js
          build/web/*Web*.js
          build/web/*Web*.wasm
          build/web/audio/
          build/web/test-build.json

  # Windows WebKit has no Web Audio. Use the same WASM in a WebKit build with audio.
  web-mobile:
    needs: web
    if: ${{ !cancelled() && needs.web.result != 'skipped' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        name: web-demo-test-build
        path: build/web
    - name: Install WebKit
      working-directory: plugin/tests/web
      run: |
        npm ci
        npx playwright install webkit
    - name: Test iPhone portrait and landscape with real Web Audio
      working-directory: plugin/tests/web
      run: npm test -- --no-ai --engine=webkit
    - name: Upload iPhone results and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-mobile-results
        path: plugin/tests/web/out/

  # One work-branch gate, including the mobile WebKit/Chromium checks in web.
  ci-ok:
    if: always()
    needs: [mac-build, mac-intel, windows, compare, web, web-mobile]
    runs-on: ubuntu-latest
    steps:
    - name: Require every test job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 -c 'import json, os; jobs=json.loads(os.environ["RESULTS"]); assert all(j["result"] == "success" for j in jobs.values()), jobs'
