name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      id: cache-libs
      uses: actions/cache@v4
      with:
        path: ${{github.workspace}}
        key: libs

    # CONFIGURE PROJECTS
    # ===========================================================================
    - name: Configure CMake
      run: cmake -S . -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    # COMPILE EXECUTABLES
    # ===========================================================================
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }}

    # RUN TESTING
    # ===========================================================================
    # Uncomment if you have tests to run
    # - name: Test
    #   working-directory: ${{github.workspace}}/build
    #   run: ctest -C ${{ matrix.build_type }}

    # UPLOAD ARTIFACTS
    # ===========================================================================
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build-Output-${{ matrix.os }}
        path: ${{github.workspace}}/build/plugin/MyPluginTitle_artefacts/Release
        retention-days: 7  # Optional: specify how long to retain the artifacts